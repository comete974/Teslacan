; ─── Template pour un ESP32-C3 ───────────────────────────────────────────────
; Dupliquer ce dossier pour chaque boitier de boutons supplémentaire.
; Changer DEVICE_NAME dans include/config.h avant de flasher chaque board.

[env:buttons]
platform  = espressif32
board     = esp32-c3-devkitm-1
framework = arduino

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -I include
    -I ../shared
