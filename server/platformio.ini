[env:server]
platform  = espressif32
board     = esp32dev
framework = arduino

; BLE + WiFi + WebServer = ~1.77 MB → dépasse la partition par défaut (1.31 MB)
; huge_app alloue 3 MB à l'app sur un flash 4 MB
board_build.partitions = huge_app.csv

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    bblanchon/ArduinoJson @ ^7.2.0

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -I include
    -I ../shared
