[env:server]
platform  = espressif32
board     = esp32dev
framework = arduino

monitor_speed  = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -I../shared

; No external CAN library needed — uses ESP32 built-in TWAI (CAN) peripheral
; accessed via driver/twai.h from the arduino-esp32 SDK
